import os
from datetime import datetime

class Task:
    def __init__(self, title, completed=False, created_at=None):
        self.title = title
        self.completed = completed
        self.created_at = created_at or datetime.now().isoformat()
    
    def to_dict(self):
        return {
            "title": self.title,
            "completed": self.completed,
            "created_at": self.created_at
        }
    
    @classmethod
    def from_dict(cls, data):
        return cls(
            data["title"],
            data["completed"],
            data["created_at"]
        )
    
    def __str__(self):
        status = "✓" if self.completed else "○"
        return f"[{status}] {self.title}"

class TaskManager:
    def __init__(self, filename="tasks.json"):
        self.filename = filename
        self.tasks = []
        self.load()
    
    def add(self, title):
        task = Task(title)
        self.tasks.append(task)
        self.save()
        print(f"Задача добавлена: {task}")
    
    def list_tasks(self):
        if not self.tasks:
            print("Список задач пуст")
            return
        for i, task in enumerate(self.tasks, 1):
            print(f"{i}. {task}")
    
    def complete(self, index):
        try:
            self.tasks[index - 1].completed = True
            self.save()
            print("Задача отмечена как выполненная")
        except IndexError:
            print("Неверный номер задачи")
    
    def delete(self, index):
        try:
            removed = self.tasks.pop(index - 1)
            self.save()
            print(f"Удалена: {removed}")
        except IndexError:
            print("Неверный номер задачи")
    
    def save(self):
        data = [task.to_dict() for task in self.tasks]
        with open(self.filename, "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
    
    def load(self):
        if os.path.exists(self.filename):
            with open(self.filename, "r", encoding="utf-8") as f:
                data = json.load(f)
                self.tasks = [Task.from_dict(d) for d in data]

function selectOption(taskKey, selectedIdx, correctIdx, lessonId) {
  const buttons = document.querySelectorAll(`[data-task="${taskKey}"]`);
  const feedback = document.getElementById(`feedback-${taskKey}`);
  const statusEl = document.getElementById(`task-status-${taskKey}`);
  const taskCard = document.getElementById(`task-${taskKey}`);
  
  // Сохраняем ответ
  state.taskAnswers[taskKey] = selectedIdx;
  saveState();
  
  buttons.forEach((btn, idx) => {
    btn.classList.remove('selected', 'correct-answer', 'wrong-answer');
    btn.disabled = false;
    
    if (idx === correctIdx) {
      btn.classList.add('correct-answer');
    }
    if (idx === selectedIdx && selectedIdx !== correctIdx) {
      btn.classList.add('wrong-answer');
    }
  });
  
  if (selectedIdx === correctIdx) {
    feedback.innerHTML = '<i class="fas fa-check-circle mr-1" style="color: var(--accent-green);"></i> Правильно! Отличная работа!';
    feedback.style.color = 'var(--accent-green)';
    statusEl.style.background = 'var(--accent-green)';
    taskCard.classList.add('correct');
    taskCard.classList.remove('incorrect');
  } else {
    feedback.innerHTML = '<i class="fas fa-times-circle mr-1" style="color: #ef4444;"></i> Неверно. Попробуйте ещё раз или посмотрите правильный ответ.';
    feedback.style.color = '#ef4444';
    statusEl.style.background = '#ef4444';
    taskCard.classList.add('incorrect');
    taskCard.classList.remove('correct');
  }
  feedback.classList.remove('hidden');
  
  checkLessonCompletion(lessonId);
}

function checkCode(taskKey, lessonId, taskIdx) {
  const textarea = document.getElementById(`code-${taskKey}`);
  const code = textarea.value;
  const feedback = document.getElementById(`feedback-${taskKey}`);
  const statusEl = document.getElementById(`task-status-${taskKey}`);
  const taskCard = document.getElementById(`task-${taskKey}`);
  const lesson = courseData.find(l => l.id === lessonId);
  const task = lesson.tasks[taskIdx];
  
  if (!code.trim()) {
    feedback.innerHTML = '<i class="fas fa-exclamation-circle mr-1" style="color: var(--accent-yellow);"></i> Напишите код перед проверкой';
    feedback.style.color = 'var(--accent-yellow)';
    feedback.classList.remove('hidden');
    return;
  }
  
  state.taskAnswers[taskKey] = code;
  saveState();
  
  const isCorrect = task.check(code);
  
  if (isCorrect) {
    feedback.innerHTML = '<i class="fas fa-check-circle mr-1" style="color: var(--accent-green);"></i> Отлично! Код правильный!';
    feedback.style.color = 'var(--accent-green)';
    statusEl.style.background = 'var(--accent-green)';
    taskCard.classList.add('correct');
    taskCard.classList.remove('incorrect');
    textarea.style.borderColor = 'var(--accent-green)';
    showNotification('Задание выполнено! 🎉');
  } else {
    feedback.innerHTML = '<i class="fas fa-times-circle mr-1" style="color: #ef4444;"></i> Код не совсем корректен. Проверьте синтаксис и попробуйте снова.';
    feedback.style.color = '#ef4444';
    statusEl.style.background = '#ef4444';
    taskCard.classList.add('incorrect');
    taskCard.classList.remove('correct');
    textarea.style.borderColor = '#ef4444';
  }
  feedback.classList.remove('hidden');
  
  checkLessonCompletion(lessonId);
}

function getSolutionExample(task) {
  // Возвращаем пример решения на основе подсказки
  if (task.hint) {
    return task.hint;
  }
  return '# Решение зависит от вашей реализации';
}

function restoreTaskAnswers(lessonId) {
  const lesson = courseData.find(l => l.id === lessonId);
  lesson.tasks.forEach((task, idx) => {
    const taskKey = `${lessonId}-${idx}`;
    const savedAnswer = state.taskAnswers[taskKey];
    
    if (savedAnswer !== undefined) {
      if (task.type === 'choice') {
        selectOption(taskKey, savedAnswer, task.correct, lessonId);
      } else if (task.type === 'code') {
        const textarea = document.getElementById(`code-${taskKey}`);
        if (textarea) {
          textarea.value = savedAnswer;
        }
      }
    }
  });
}

function checkLessonCompletion(lessonId) {
  const lesson = courseData.find(l => l.id === lessonId);
  let allCorrect = true;
  
  lesson.tasks.forEach((task, idx) => {
    const taskKey = `${lessonId}-${idx}`;
    const taskCard = document.getElementById(`task-${taskKey}`);
    
    if (!taskCard || !taskCard.classList.contains('correct')) {
      allCorrect = false;
    }
  });
  
  if (allCorrect && !state.completedLessons.includes(lessonId)) {
    state.completedLessons.push(lessonId);
    saveState();
    renderLessonList();
    showNotification(`🎉 Урок "${lesson.title}" завершён!`);
  }
}

function showNotification(message) {
  const existing = document.querySelector('.notification');
  if (existing) existing.remove();
  
  const notif = document.createElement('div');
  notif.className = 'notification';
  notif.innerHTML = `<i class="fas fa-check-circle mr-2" style="color: var(--accent-green);"></i> ${message}`;
  document.body.appendChild(notif);
  
  setTimeout(() => {
    notif.style.animation = 'slideInRight 0.3s ease reverse';
    setTimeout(() => notif.remove(), 300);
  }, 3000);
}

function resetProgress() {
  if (confirm('Вы уверены, что хотите сбросить весь прогресс? Это действие нельзя отменить.')) {
    state.completedLessons = [];
    state.taskAnswers = {};
    localStorage.removeItem('completedLessons');
    localStorage.removeItem('taskAnswers');
    updateProgress();
    renderLessonList();
    showHome();
    showNotification('Прогресс сброшен');
  }
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('active');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('active');
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  renderLessonList();
  updateProgress();
  showHome();
});
</script>

</body>
</html>
