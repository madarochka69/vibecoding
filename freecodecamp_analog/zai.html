<html lang="ru">
<head>

<title>PyCamp — Полный курс Python</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<!-- Pyodide: Python в браузере -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>

<style>
:root{
  --bg:#0a0a23;            /* freeCodeCamp глубокий синий */
  --bg-2:#1b1b32;
  --bg-3:#2a2a40;
  --bg-panel:#1d1d35;
  --primary:#f1be32;       /* жёлтый акцент fCC */
  --primary-2:#feac32;
  --accent:#99c9ff;
  --green:#7ee787;
  --red:#ff7b72;
  --text:#f0f0f5;
  --text-dim:#a0a0b8;
  --border:#3a3a5c;
  --border-light:#4a4a6c;
  --sidebar-w:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  display:flex;flex-direction:column;overflow:hidden;
}
a{color:var(--accent);text-decoration:none}

/* ===== Header ===== */
header{
  background:var(--bg-2);border-bottom:1px solid var(--border);
  padding:0 20px;height:56px;display:flex;align-items:center;
  gap:18px;flex-shrink:0;position:relative;z-index:30;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-0.3px}
.logo .badge{
  background:var(--primary);color:#1b1b32;padding:4px 8px;border-radius:6px;font-weight:900;
}
.logo .name{color:var(--text)}
.logo .name span{color:var(--primary)}
.header-nav{display:flex;gap:6px;margin-left:14px}
.header-nav a{
  color:var(--text-dim);padding:6px 12px;border-radius:6px;font-size:14px;font-weight:500;
  transition:all .15s;cursor:pointer;
}
.header-nav a:hover{color:var(--text);background:var(--bg-3)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.progress-mini{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);
}
.progress-mini .bar{width:120px;height:6px;background:var(--bg-3);border-radius:3px;overflow:hidden}
.progress-mini .bar > div{height:100%;background:var(--green);transition:width .4s}
.btn-donate{
  background:var(--primary);color:#1b1b32;border:none;padding:8px 14px;
  border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;
}
.btn-donate:hover{background:var(--primary-2)}

/* ===== Layout ===== */
.app{display:flex;flex:1;overflow:hidden}

/* ===== Sidebar ===== */
.sidebar{
  width:var(--sidebar-w);background:var(--bg-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;
}
.sidebar-head{
  padding:18px 20px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sidebar-head h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);font-weight:700}
.sidebar-head .count{font-size:12px;color:var(--primary);font-weight:700}
.sidebar-search{padding:12px 16px;border-bottom:1px solid var(--border)}
.sidebar-search input{
  width:100%;background:var(--bg-3);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:6px;font-size:13px;outline:none;
}
.sidebar-search input:focus{border-color:var(--primary)}
.curriculum{flex:1;overflow-y:auto;padding:8px 0}
.curriculum::-webkit-scrollbar{width:8px}
.curriculum::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
.module-title{
  padding:10px 20px 6px;font-size:11px;text-transform:uppercase;letter-spacing:0.8px;
  color:var(--text-dim);font-weight:700;background:var(--bg-2);position:sticky;top:0;
}
.lesson-item{
  padding:10px 20px 10px 28px;display:flex;align-items:center;gap:10px;
  cursor:pointer;font-size:14px;color:var(--text-dim);position:relative;
  transition:all .12s;border-left:3px solid transparent;
}
.lesson-item:hover{background:var(--bg-3);color:var(--text)}
.lesson-item.active{background:var(--bg-3);color:var(--text);border-left-color:var(--primary)}
.lesson-item.done .icon{background:var(--green);color:#0a0a23;border-color:var(--green)}
.lesson-item .icon{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--border-light);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;
}
.lesson-item .num{font-size:11px;color:var(--text-dim);margin-left:auto;font-weight:600}

/* ===== Main content ===== */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.lesson-header{
  background:var(--bg-2);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;gap:16px;flex-shrink:0;
}
.lesson-header .crumb{font-size:12px;color:var(--text-dim);margin-bottom:2px}
.lesson-header h1{font-size:19px;font-weight:700;letter-spacing:-0.2px}
.lesson-header .actions{margin-left:auto;display:flex;gap:8px}
.btn{
  background:var(--bg-3);color:var(--text);border:1px solid var(--border-light);
  padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;transition:all .12s;
}
.btn:hover{background:var(--border-light)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#1b1b32;border-color:var(--primary);font-weight:700}
.btn-primary:hover{background:var(--primary-2);border-color:var(--primary-2)}
.btn-primary:disabled{background:var(--bg-3);color:var(--text-dim);border-color:var(--border)}

.content{flex:1;display:flex;overflow:hidden}
.description{
  flex:1;overflow-y:auto;padding:24px 32px;min-width:0;
}
.description::-webkit-scrollbar{width:10px}
.description::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:5px}
.description h2{font-size:22px;margin:24px 0 12px;font-weight:700;color:var(--text)}
.description h2:first-child{margin-top:0}
.description h3{font-size:17px;margin:18px 0 10px;color:var(--accent);font-weight:700}
.description p{margin:0 0 14px;color:var(--text);font-size:15px}
.description ul,.description ol{margin:0 0 14px 0;padding-left:24px}
.description li{margin-bottom:6px;font-size:15px}
.description code{
  background:var(--bg-2);padding:2px 6px;border-radius:4px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  font-size:13px;color:var(--primary);border:1px solid var(--border);
}
.description pre{
  background:var(--bg-2);border:1px solid var(--border);border-radius:8px;
  padding:14px 18px;overflow-x:auto;margin:0 0 16px;
}
.description pre code{
  background:none;border:none;padding:0;color:var(--text);font-size:13.5px;line-height:1.55;
}
.description blockquote{
  border-left:4px solid var(--primary);padding:10px 16px;margin:0 0 16px;
  background:var(--bg-2);border-radius:0 6px 6px 0;color:var(--text-dim);
}
.description blockquote strong{color:var(--text)}
.description hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.description table{border-collapse:collapse;margin:0 0 16px;width:100%}
.description th,.description td{border:1px solid var(--border);padding:8px 12px;text-align:left;font-size:14px}
.description th{background:var(--bg-2)}
.description .test-list{margin:18px 0;padding:0;list-style:none}
.description .test-list li{
  background:var(--bg-2);border:1px solid var(--border);border-left:3px solid var(--primary);
  padding:10px 14px;margin-bottom:8px;border-radius:4px;font-size:14px;
  display:flex;align-items:flex-start;gap:8px;
}
.description .test-list li::before{content:'✓';color:var(--green);font-weight:bold;font-size:16px}

/* ===== Workspace (editor + terminal) ===== */
.workspace{
  width:48%;min-width:380px;flex-shrink:0;display:flex;flex-direction:column;
  border-left:1px solid var(--border);background:var(--bg-2);
}
.ws-tabs{display:flex;background:var(--bg-2);border-bottom:1px solid var(--border);flex-shrink:0}
.ws-tab{
  padding:10px 18px;font-size:13px;font-weight:600;color:var(--text-dim);
  cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;
}
.ws-tab.active{color:var(--text);border-bottom-color:var(--primary)}
.ws-tab:hover{color:var(--text)}
.ws-toolbar{
  padding:8px 14px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid var(--border);background:var(--bg-2);flex-shrink:0;
}
.ws-toolbar .filename{font-size:13px;color:var(--text-dim);font-family:monospace}
.ws-toolbar .spacer{flex:1}
.editor-wrap{flex:1;overflow:hidden;min-height:0;position:relative}
.CodeMirror{
  height:100% !important;font-size:14px;font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
  background:#282a36 !important;line-height:1.55;
}
.CodeMirror-gutters{background:#282a36 !important;border-right:1px solid var(--border) !important}
.terminal{
  flex:1;overflow-y:auto;padding:14px 18px;font-family:'SFMono-Regular',Consolas,monospace;
  font-size:13px;line-height:1.6;background:#1e1e2e;color:var(--text);min-height:0;
}
.terminal::-webkit-scrollbar{width:8px}
.terminal::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:4px}
.terminal .line{white-space:pre-wrap;word-break:break-word;margin-bottom:2px}
.terminal .out{color:var(--text)}
.terminal .err{color:var(--red)}
.terminal .sys{color:var(--accent);font-style:italic}
.terminal .ok{color:var(--green)}
.terminal .prompt{color:var(--primary)}
.test-panel{
  border-top:1px solid var(--border);background:var(--bg-3);max-height:200px;
  overflow-y:auto;flex-shrink:0;
}
.test-panel-head{
  padding:8px 14px;font-size:12px;text-transform:uppercase;letter-spacing:1px;
  color:var(--text-dim);font-weight:700;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.test-row{
  padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;
  border-bottom:1px solid var(--border);
}
.test-row .state{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--border-light);
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;
}
.test-row.pass .state{background:var(--green);border-color:var(--green);color:#0a0a23}
.test-row.fail .state{background:var(--red);border-color:var(--red);color:#fff}
.test-row .label{flex:1}
.test-row .msg{font-size:12px;color:var(--text-dim);font-family:monospace}

/* ===== Splash ===== */
.splash{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:100;transition:opacity .5s;
}
.splash.hide{opacity:0;pointer-events:none}
.splash .logo-big{font-size:48px;font-weight:900;margin-bottom:20px;letter-spacing:-1px}
.splash .logo-big span{color:var(--primary)}
.splash .sub{color:var(--text-dim);margin-bottom:30px;font-size:15px}
.splash .loader{
  width:240px;height:6px;background:var(--bg-3);border-radius:3px;overflow:hidden;
}
.splash .loader > div{
  height:100%;background:var(--primary);width:0;transition:width .3s;
}
.splash .status{margin-top:14px;color:var(--text-dim);font-size:13px;min-height:18px}

/* ===== Toast ===== */
.toast-wrap{position:fixed;top:70px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{
  background:var(--bg-3);border:1px solid var(--border-light);border-left:4px solid var(--primary);
  padding:12px 16px;border-radius:6px;font-size:14px;min-width:260px;max-width:360px;
  box-shadow:0 6px 20px rgba(0,0,0,.4);animation:slideIn .25s ease;
}
.toast.ok{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== Modal (donate / about) ===== */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
  align-items:center;justify-content:center;z-index:150;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--bg-2);border:1px solid var(--border);border-radius:10px;
  padding:28px;max-width:440px;width:90%;
}
.modal h2{margin-bottom:14px;color:var(--primary)}
.modal p{color:var(--text-dim);margin-bottom:18px;font-size:14px}
.modal .close{margin-top:8px}

/* ===== Mobile ===== */
.mobile-toggle{display:none}
@media (max-width:980px){
  .sidebar{position:fixed;left:0;top:56px;bottom:0;transform:translateX(-100%);transition:transform .25s;z-index:25}
  .sidebar.open{transform:translateX(0)}
  .mobile-toggle{display:inline-flex}
  .workspace{width:100%;min-width:0;border-left:none;border-top:1px solid var(--border)}
  .content{flex-direction:column}
  .description{padding:18px}
}
</style>
</head>

<script>
/* ============================================================
   CURRICULUM — полный курс Python
   ============================================================ */
const CURRICULUM = []; // заполняется ниже

/* Служебные функции для конвертации Markdown-подобной разметки */
function md(text){
  // экранируем
  let t = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // блочное коде ```...```
  t = t.replace(/```(\w+)?\n([\s\S]*?)```/g, (m,lang,code)=>{
    return '<pre><code>'+code.replace(/\n$/,'')+'</code></pre>';
  });
  // инлайн-код `...`
  t = t.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // заголовки
  t = t.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  t = t.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  // цитаты
  t = t.replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  // hr
  t = t.replace(/^---$/gm,'<hr>');
  // списки
  t = t.replace(/^- (.+)$/gm,'<li>$1</li>');
  t = t.replace(/(<li>[\s\S]*?<\/li>)(?:\n\n|$)/g,'<ul>$1</ul>');
  t = t.replace(/(<li>[\s\S]*?<\/li>)\n(<li>)/g,'$1$2');
  // нумерованные списки
  t = t.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  // **bold**
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // параграфы
  t = t.split(/\n\n+/).map(p=>{
    if(/^<(h\d|ul|ol|pre|blockquote|hr|table)/.test(p.trim())) return p;
    return '<p>'+p.replace(/\n/g,'<br>')+'</p>';
  }).join('\n');
  return t;
}

/* ----- Урок 1 ----- */
CURRICULUM.push({
  module: 'Основы Python',
  title: 'Вывод на экран: print()',
  description: `
## Добро пожаловать в PyCamp!

В этом курсе вы освоите Python с нуля до продвинутого уровня — прямо в браузере, без установки чего-либо. Код пишется в редакторе справа, запускается нажатием кнопки **Запустить**, а автоматические тесты проверяют ваше решение.

## Функция print()

Функция \`print()\` выводит текст на экран. Текст, который нужно вывести, заключается в кавычки — одинарные \`'…'\` или двойные \`"…"\`.

\`\`\`python
print("Hello, World!")
print('Привет, Python!')
\`\`\`

Оба варианта работают одинаково. Выбирайте те кавычки, которые не конфликтуют с текстом внутри.

## Задание

В редакторе уже есть стартовый код. Измените его так, чтобы:

1. Вывелось ровно три строки.
2. Первая строка: \`Hello, World!\`
3. Вторая строка: \`Я изучаю Python\`
4. Третья строка: \`Это мой первый код\`

> **Совет:** каждый \`print()\` выводит свою строку и автоматически переносит курсор на новую.

### Тесты
- На экран выведена фраза \`Hello, World!\`
- Выведено ровно три строки
- Вывод содержит слово \`Python\`
`,
  starterCode: `# Напишите три функции print() ниже:
print("Hello, World!")

`,
  tests: [
    {label:'Вывод содержит "Hello, World!"', check:"'Hello, World!' in _output"},
    {label:'Выведено ровно 3 строки', check:"len([l for l in _output.strip().split('\\n')]) == 3"},
    {label:'В выводе есть слово Python', check:"'Python' in _output"},
  ]
});

/* ----- Урок 2 ----- */
CURRICULUM.push({
  module: 'Основы Python',
  title: 'Переменные и типы данных',
  description: `
## Что такое переменная

Переменная — это «коробка с именем», в которой хранится значение. Вы присваиваете значение через знак \`=\`:

## Что такое генератор

Генератор — функция, которая **возвращает значения по одному**, не вычисляя всё сразу. Вместо \`return\` используется \`yield\`:

\`\`\`python

При каждом \`yield\` функция «замораживается», а при следующем вызове \`next()\` — продолжает с того же места.

## Экономия памяти

\`\`\`python
# Плохо для больших N — весь список в памяти:
def squares_list(n):
    return [x**2 for x in range(n)]

def squares_gen(n):
    for x in range(n):
        yield x**2

    while True:

print(next(gen))  # 2
print(next(gen))  # 3

/* ----- Запуск кода ----- */
async function runCode(){
  if(!pyodide){
    toast('Pyodide ещё загружается, подождите…', 'err');
    return;
  }
  const code = editor ? editor.getValue() : $('#codeEditor').value;
  STORE.saveCode(currentIdx, code);

  const term = $('#terminal');
  switchTab('console');
  term.innerHTML = '<div class="line sys">▶ Запуск…</div>';

  // Подготовка Python-кода: оборачиваем пользовательский код,
  // захватываем stdout, делаем доступными _output, _globals, _error, _code
  const wrapped = `
import io, sys, traceback
__user_code__ = ${JSON.stringify(code)}
_output = ""
_globals = {}
_error = None
_code = __user_code__
try:
    _buf = io.StringIO()
    _old_stdout = sys.stdout
    sys.stdout = _buf
    exec(__user_code__, _globals)
    sys.stdout = _old_stdout
    _output = _buf.getvalue()
except Exception as _e:
    sys.stdout = _old_stdout
    _output = _buf.getvalue() if '_buf' in dir() else ""
    _error = _e
    _error_traceback = traceback.format_exc()
`;
  try {
    await pyodide.runPythonAsync(wrapped);
    const output = pyodide.globals.get('_output') || '';
    const error  = pyodide.globals.get('_error');
    const tb     = pyodide.globals.get('_error_traceback');

    if(output){
      output.split('\n').forEach(l => {
        if(l.length) term.innerHTML += `<div class="line out">${escapeHtml(l)}</div>`;
      });
    }
    if(error){
      term.innerHTML += `<div class="line err">${escapeHtml(tb || String(error))}</div>`;
    }
    term.innerHTML += `<div class="line sys">◊ Выполнено ${error ? 'с ошибкой' : 'успешно'}</div>`;
  } catch(e){
    term.innerHTML += `<div class="line err">JS error: ${escapeHtml(e.message)}</div>`;
  }
}

  // Тот же wrapper, что и в runCode
  const wrapped = `

__user_code__ = ${JSON.stringify(code)}
_output = ""
_globals = {}
_error = None
_code = __user_code__
try:
    _buf = io.StringIO()
    _old_stdout = sys.stdout
    sys.stdout = _buf
    exec(__user_code__, _globals)
    sys.stdout = _old_stdout
    _output = _buf.getvalue()
except Exception as _e:
    sys.stdout = _old_stdout
    _output = _buf.getvalue() if '_buf' in dir() else ""
    _error = _e
`;
  try {
    await pyodide.runPythonAsync(wrapped);
    const output = pyodide.globals.get('_output') || '';
    const error  = pyodide.globals.get('_error');

    // Если в коде пользователя было исключение — показываем
    if(error){
      switchTab('console');
      term.innerHTML = `<div class="line err">Код завершился с ошибкой:</div>`;
      String(pyodide.runPython('traceback.format_exc()')).split('\n').forEach(l => {
        if(l.length) term.innerHTML += `<div class="line err">${escapeHtml(l)}</div>`;
      });
      toast('Код содержит ошибку — исправьте и попробуйте снова', 'err');
      return;
    }

    // Запускаем тесты
    switchTab('tests');
    const testList = $('#testList');
    testList.innerHTML = '';
    let passed = 0;
    for(let i = 0; i < lesson.tests.length; i++){
      const test = lesson.tests[i];
      let ok = false, msg = '';
      try {
        const result = pyodide.runPython(`bool(${test.check})`);
        ok = !!result;
      } catch(e){
        ok = false;
        msg = e.message;
      }
      const row = document.createElement('div');
      row.className = 'test-row ' + (ok ? 'pass' : 'fail');
      row.innerHTML = `
        <div class="state">${ok ? '✓' : '✕'}</div>
        <div class="label">${test.label}</div>
        <div class="msg">${msg ? escapeHtml(msg) : ''}</div>
      `;
      testList.appendChild(row);
      if(ok) passed++;
    }
    $('#testSummary').textContent = `${passed} / ${lesson.tests.length}`;
    if(passed === lesson.tests.length){
      STORE.markComplete(currentIdx);
      toast('Все тесты пройдены! 🎉', 'ok');
      renderCurriculum($('#searchInput').value);
    } else {
      toast(`Пройдено ${passed} из ${lesson.tests.length} тестов`, 'err');
    }
  } catch(e){
    switchTab('console');
    term.innerHTML += `<div class="line err">JS error: ${escapeHtml(e.message)}</div>`;
  }
}

    '<p>PyCamp — бесплатный open-source курс Python. Если он вам понравился, расскажите о нём друзьям или <a href="https://www.freecodecamp.org/news/the-c-programming-handbook-for-beginners/" target="_blank">поддержите оригинальный freeCodeCamp</a>.</p><p>Этот проект создан как образовательный аналог в одном HTML-файле и не принимает пожертвования напрямую.</p>'
  );
  $('#navAbout').onclick = (e) => { e.preventDefault();
    openModal('О проекте PyCamp',
      '<p><b>PyCamp</b> — это интерактивный курс Python, работающий полностью в браузере. Никакой установки: Python запускается через <a href="https://pyodide.org" target="_blank">Pyodide</a> (WebAssembly), редактор — <a href="https://codemirror.net" target="_blank">CodeMirror</a>.</p>' +
      '<p>Курс охватывает 22 урока: от <code>print()</code> до генераторов и декораторов. Ваш прогресс сохраняется в localStorage браузера.</p>' +
      '<p><b>Горячие клавиши:</b><br>Ctrl/Cmd + Enter — запустить код<br>Ctrl + S — сохранить<br>Tab — отступ 4 пробела</p>');
  };
  $('#navCurriculum').onclick = (e) => { e.preventDefault();
    $('#sidebar').classList.add('open');
    $('#curriculum').scrollTop = 0;
  };
  $('#navForum').onclick = (e) => { e.preventDefault();
    openModal('Форум', '<p>Форум в этой версии не реализован — весь курс работает локально в вашем браузере. Обсудить Python можно на <a href="https://www.reddit.com/r/learnpython/" target="_blank">r/learnpython</a> или в <a href="https://forum.freecodecamp.org/" target="_blank">форуме freeCodeCamp</a>.</p>');
  };
  $('#modalClose').onclick = closeModal;
  $('#modal').onclick = (e) => { if(e.target.id === 'modal') closeModal(); };

  // Сохранение кода при изменениях (с задержкой)
  if(editor){
    let saveTimer = null;
    editor.on('change', () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        STORE.saveCode(currentIdx, editor.getValue());
      }, 800);
    });
  }
}

/* ----- Старт ----- */
window.addEventListener('DOMContentLoaded', () => {
  initUI();
  initPyodide().catch(err => {
    setStatus('Ошибка загрузки: ' + err.message);
    console.error(err);
  });
});
</script>
