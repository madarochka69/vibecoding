<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeCodeCamp Analog — Навигация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #58a6ff;
        }

        p.subtitle {
            color: #8b949e;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 400px;
        }

        nav a {
            display: block;
            padding: 16px 24px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            text-decoration: none;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.2s ease;
        }

        nav a:hover {
            background-color: #1f2937;
            border-color: #58a6ff;
            color: #58a6ff;
            transform: translateX(4px);
        }

        nav a::before {
            content: '📄 ';
        }
    </style>
</head>
